<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar na fila</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Sistema de fila</div>
  <h1>Entrar na fila de atendimento</h1>
  <p class="subtitle">Preencha seus dados para retirar sua senha. Quando chegar a sua vez, avisamos por e-mail.</p>

  <div class="card">
    <form id="form-entrada">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>

      <label for="telefone">Telefone</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="voce@email.com">

      <button type="submit" class="btn-primary" id="btn-entrar">Retirar senha</button>
      <div class="erro" id="msg-erro"></div>
    </form>

    <div class="confirmacao" id="bloco-confirmacao" style="display:none;">
      <div class="eyebrow" style="justify-content:center;">Sua senha</div>
      <div class="senha-grande" id="senha-numero">--</div>
      <div class="posicao" id="posicao-texto"></div>
      <button class="btn-secondary" style="margin-top:24px;" onclick="location.reload()">Entrar outra pessoa</button>
    </div>
  </div>

  <p style="margin-top:24px;"><a class="link-discreto" href="painel.html">Ver painel de chamadas →</a></p>
</div>

<script>
const form = document.getElementById('form-entrada');
const msgErro = document.getElementById('msg-erro');
const btnEntrar = document.getElementById('btn-entrar');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msgErro.textContent = '';
  btnEntrar.disabled = true;
  btnEntrar.textContent = 'Enviando...';

  const dados = {
    nome: document.getElementById('nome').value,
    telefone: document.getElementById('telefone').value,
    email: document.getElementById('email').value,
  };

  try {
    const resp = await fetch('/api/entrar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(dados),
    });
    const dado = await resp.json();

    if (!resp.ok) {
      msgErro.textContent = dado.erro || 'Não foi possível entrar na fila.';
      btnEntrar.disabled = false;
      btnEntrar.textContent = 'Retirar senha';
      return;
    }

    document.getElementById('senha-numero').textContent = dado.senha;
    document.getElementById('posicao-texto').textContent =
      dado.posicaoNaFila <= 1 ? 'Você é o próximo!' : `${dado.posicaoNaFila} pessoas na sua frente`;
    form.style.display = 'none';
    document.getElementById('bloco-confirmacao').style.display = 'block';
  } catch (erro) {
    msgErro.textContent = 'Erro de conexão. Tente novamente.';
    btnEntrar.disabled = false;
    btnEntrar.textContent = 'Retirar senha';
  }
});
</script>
</body>
</html>
